    <path d="M53 253C120 253 119 157 186 157s67 96 134 96 67-96 134-96 67 96 134 96 67-96 134-96 67 96 134 96 67-96 134-96 67 96 134 96" fill="none" stroke="#78d59e" stroke-width="2" opacity=".22"/>
