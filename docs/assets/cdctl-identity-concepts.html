<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cdctl identity concepts</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-monospace, "Cascadia Code", "SFMono-Regular", Menlo, Consolas, monospace;
      background: #171817;
      color: #e8e5dc;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    main {
      width: min(1280px, calc(100% - 48px));
      margin: 0 auto;
      padding: 52px 0 72px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid #4b4b47;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0;
    }

    header p {
      margin: 0;
      color: #aaa9a0;
      font-size: 13px;
    }

    .concepts {
      display: grid;
      gap: 42px;
      margin-top: 40px;
    }

    article { min-width: 0; }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 13px;
    }

    h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }

    .label {
      color: #adaba2;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .asset-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 88px;
      align-items: center;
      gap: 20px;
    }

    .banner {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #4a4b46;
    }

    .icon-panel {
      display: grid;
      justify-items: center;
      gap: 8px;
      color: #aaa9a0;
      font-size: 11px;
    }

    .icon { width: 48px; height: 48px; }

    @media (max-width: 640px) {
      main { width: min(100% - 28px, 1280px); padding-top: 28px; }
      header { display: block; }
      header p { margin-top: 8px; }
      .asset-row { grid-template-columns: minmax(0, 1fr) 58px; gap: 12px; }
      .meta { align-items: start; flex-direction: column; gap: 5px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>cdctl / visual identity studies</h1>
      <p>banner: 1120 x 400 &nbsp; icon: 48px preview</p>
    </header>
    <section class="concepts" aria-label="Identity concepts">
      <article>
        <div class="meta"><h2>01 / Amber CRT</h2><span class="label">current direction</span></div>
        <div class="asset-row">
          <img class="banner" src="cdctl-banner.svg" alt="Amber CRT cdctl banner">
          <div class="icon-panel"><img class="icon" src="cdctl-icon.svg" alt="Amber CRT cdctl icon"><span>48px</span></div>
        </div>
      </article>
      <article>
        <div class="meta"><h2>02 / Vector Field</h2><span class="label">phosphor instrument</span></div>
        <div class="asset-row">
          <img class="banner" src="cdctl-concept-vector-banner.svg" alt="Vector Field cdctl banner">
          <div class="icon-panel"><img class="icon" src="cdctl-concept-vector-icon.svg" alt="Vector Field cdctl icon"><span>48px</span></div>
        </div>
      </article>
      <article>
        <div class="meta"><h2>03 / Rack Signal</h2><span class="label">equipment faceplate</span></div>
        <div class="asset-row">
          <img class="banner" src="cdctl-concept-rack-banner.svg" alt="Rack Signal cdctl banner">
          <div class="icon-panel"><img class="icon" src="cdctl-concept-rack-icon.svg" alt="Rack Signal cdctl icon"><span>48px</span></div>
        </div>
      </article>
      <article>
        <div class="meta"><h2>04 / Paper Cut</h2><span class="label">fresh direction</span></div>
        <div class="asset-row">
          <img class="banner" src="cdctl-concept-scratch-banner.svg" alt="Paper Cut cdctl banner">
          <div class="icon-panel"><img class="icon" src="cdctl-concept-scratch-icon.svg" alt="Paper Cut cdctl icon"><span>48px</span></div>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
